[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[features]
default = ["editing", "macros"]
# The editing commands' code. Without it they keep their place in the command list and refuse as
# in viewer mode ([`viewer::EDITING_BUILD`]): the build is GridCraft Viewer. The web viewer leaves
# it out.
editing = []
# Running, checking, recording and debugging macros. Without it the commands are there but say
# this build doesn't run macros ([`macros::RUNTIME`]); macros are still read and kept with the
# file. GridCraft Viewer's web build leaves it out: it runs no macros.
macros = []

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
gridcraft-math = { workspace = true }
image = { workspace = true }

[dev-dependencies]
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
